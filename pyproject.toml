[project]
name = "arp-ai-runtime-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "google-genai>=2.17.0",
    "guardrails-ai>=0.10.2",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "mcp>=2.0.0",
    "mem0ai>=2.0.17",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sse-starlette>=3.4.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
